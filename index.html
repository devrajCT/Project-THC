<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mango Splash – Scroll Test</title>
<style>
  :root{--bg:#fff;--ink:#1d1d1f;--muted:#6e6e73;--accent:#e98a15;--panel:rgba(255,255,255,.92)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Inter",Segoe UI,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#fff}
  canvas{width:100vw;height:100vh;object-fit:contain;display:block}
  #track{position:relative;width:1px}
  .hud{position:fixed;left:16px;top:16px;z-index:5;background:var(--panel);border:1px solid #e5e5ea;border-radius:12px;padding:10px 12px;font-size:13px;box-shadow:0 4px 20px rgba(0,0,0,.08);max-width:calc(100vw - 32px)}
  .hud h1{font-size:14px;margin-bottom:6px}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .seg button{border:1px solid #d2d2d7;background:#fff;padding:5px 10px;border-radius:8px;cursor:pointer;font-size:12px}
  .seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .stat{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;margin-top:6px}
  #load{position:fixed;inset:auto 0 0 0;height:3px;background:var(--accent);transform-origin:left;transform:scaleX(0);z-index:6;transition:transform .2s}
  .lang{position:fixed;right:16px;bottom:16px;z-index:7;display:flex;background:#fff;border:1px solid #d2d2d7;border-radius:999px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .lang button{border:0;background:transparent;padding:7px 12px;font-size:12px;cursor:pointer}
  .lang button.on{background:var(--ink);color:#fff}
  .lang-en{display:none}
  body.en .lang-de{display:none} body.en .lang-en{display:inline}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<div id="track"></div>
<div id="load"></div>

<div class="hud">
  <h1><span class="lang-de">Mango Splash – Scroll-Test</span><span class="lang-en">Mango Splash – scroll test</span></h1>
  <div class="row seg" id="devSeg">
    <span class="lang-de">Gerät:</span><span class="lang-en">Device:</span>
    <button data-dev="desktop">Desktop</button><button data-dev="mobile">Mobile</button>
  </div>
  <div class="row seg" id="endSeg">
    <span class="lang-de">Ende:</span><span class="lang-en">Ending:</span>
    <button data-end="c1">C1</button><button data-end="c2">C2</button><button data-end="c3">C3</button>
  </div>
  <div class="row seg" id="loopSeg">
    <span class="lang-de">Loop-Wiederholungen:</span><span class="lang-en">Loop repeats:</span>
    <button data-loop="1">1</button><button data-loop="2">2</button><button data-loop="3">3</button><button data-loop="4">4</button>
  </div>
  <div class="stat" id="stat"></div>
</div>

<div class="lang"><button id="bDE" onclick="setLang('de')">DE</button><button id="bEN" onclick="setLang('en')">EN</button></div>

<script>
// Frame counts per clip (webp files named 0001.webp … in frames/<device>/<clip>/)
const COUNTS = {
  desktop:{open:125, loop:193, c1:193, c2:193, c3:193},
  mobile: {open:193, loop:193, c1:193, c2:193, c3:193}
};
const PX_PER_FRAME = 14;          // scroll distance per frame
const params = new URLSearchParams(location.search);
let state = {
  dev: params.get('dev') || (innerWidth/innerHeight < 1 ? 'mobile' : 'desktop'),
  end: params.get('end') || 'c1',
  loop: +(params.get('loop') || 3)
};
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const cache = new Map();
let seq = [];

function buildSeq(){
  const c = COUNTS[state.dev], s = [];
  const add = (clip, from) => { for(let i=from;i<=c[clip];i++) s.push(`frames/${state.dev}/${clip}/${String(i).padStart(4,'0')}.webp`); };
  add('open',1);
  for(let r=0;r<state.loop;r++) add('loop',2);   // frame 1 of loop = last frame before it → skip duplicate
  add(state.end,2);
  return s;
}
function img(src){
  if(cache.has(src)) return cache.get(src);
  const im = new Image(); im.decoding='async'; im.src = src; cache.set(src, im); return im;
}
function preload(){
  let done = 0; const bar = document.getElementById('load');
  seq.forEach(src => { const im = img(src);
    const fin = () => { done++; bar.style.transform = `scaleX(${done/seq.length})`; if(done===seq.length) setTimeout(()=>bar.style.opacity=0,400); };
    im.complete ? fin() : (im.onload = im.onerror = fin);
  });
}
let last = -1;
function draw(){
  const max = document.documentElement.scrollHeight - innerHeight;
  const p = max>0 ? scrollY/max : 0;
  const i = Math.min(seq.length-1, Math.max(0, Math.round(p*(seq.length-1))));
  const im = img(seq[i]);
  if(im.complete && im.naturalWidth){
    if(cv.width!==im.naturalWidth){ cv.width = im.naturalWidth; cv.height = im.naturalHeight; }
    if(i!==last){ ctx.drawImage(im,0,0); last=i; }
  }
  document.getElementById('stat').textContent = `${state.dev} · ${state.end.toUpperCase()} · frame ${i+1}/${seq.length} · ${seq[i].split('/').slice(-2).join('/')}`;
  requestAnimationFrame(draw);
}
function apply(){
  seq = buildSeq(); last = -1;
  document.getElementById('track').style.height = (seq.length*PX_PER_FRAME + innerHeight) + 'px';
  document.querySelectorAll('[data-dev]').forEach(b=>b.classList.toggle('on',b.dataset.dev===state.dev));
  document.querySelectorAll('[data-end]').forEach(b=>b.classList.toggle('on',b.dataset.end===state.end));
  document.querySelectorAll('[data-loop]').forEach(b=>b.classList.toggle('on',+b.dataset.loop===state.loop));
  document.getElementById('load').style.opacity=1; preload();
}
document.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{state.dev=b.dataset.dev;scrollTo(0,0);apply()});
document.querySelectorAll('[data-end]').forEach(b=>b.onclick=()=>{state.end=b.dataset.end;apply()});
document.querySelectorAll('[data-loop]').forEach(b=>b.onclick=()=>{state.loop=+b.dataset.loop;apply()});
function setLang(l){ document.body.classList.toggle('en', l==='en'); document.documentElement.lang=l;
  document.getElementById('bDE').classList.toggle('on',l==='de'); document.getElementById('bEN').classList.toggle('on',l==='en'); }
setLang('de'); apply(); requestAnimationFrame(draw);
</script>
</body>
</html>
